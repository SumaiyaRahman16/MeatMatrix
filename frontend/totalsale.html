<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Sales</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fef7f7 0%, #f8e8e8 100%);
      min-height: 100vh;
      padding: 20px;
      color: #2d1b1b;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(144,36,54,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      overflow: hidden;
      padding: 40px 30px;
    }
    .header {
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-radius: 16px;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .table-container {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(144,36,54,0.1);
      border: 1px solid rgba(144,36,54,0.1);
      margin-bottom: 40px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      color: white;
    }
    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid rgba(144,36,54,0.1);
    }
    th {
      font-weight: 600;
      font-size: 1rem;
    }
    tr:hover {
      background: rgba(144,36,54,0.03);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .back-btn {
      display: inline-block;
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(139, 38, 53, 0.2);
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(139, 38, 53, 0.3);
    }
    .back-btn i {
      margin-right: 8px;
    }
    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .delete-btn:hover {
      background: #c82333;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
    }
    @media (max-width: 768px) {
      .container {
        margin: 10px;
        border-radius: 16px;
        padding: 20px 10px;
      }
      .header {
        padding: 20px 10px;
        font-size: 1.2rem;
      }
      th, td {
        padding: 10px 6px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Total Sales</h1>
      <p>All delivered orders</p>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Item</th>
            <th>Kg</th>
            <th>Total Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="salesTable"></tbody>
      </table>
    </div>
    <a href="dashboard.html" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      Back to Dashboard
    </a>
  </div>
  <script>
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }
    function loadSales() {
      const salesData = JSON.parse(localStorage.getItem('salesData')) || [];
      const salesTable = document.getElementById('salesTable');
      if (!salesData.length) {
        salesTable.innerHTML = `<tr><td colspan="5" class="empty-state">No delivered sales yet.</td></tr>`;
        return;
      }
      salesTable.innerHTML = salesData.map((sale, index) => `
        <tr>
          <td>${formatDate(sale.date)}</td>
          <td>${sale.item}</td>
          <td>${sale.kg}</td>
          <td>৳${sale.total.toLocaleString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteSale(${index})">
              <i class="fas fa-trash"></i> Remove
            </button>
          </td>
        </tr>
      `).join('');
    }

    function deleteSale(index) {
      if (confirm('Are you sure you want to remove this sale record?')) {
        let salesData = JSON.parse(localStorage.getItem('salesData')) || [];
        salesData.splice(index, 1);
        localStorage.setItem('salesData', JSON.stringify(salesData));
        loadSales();
        alert('Sale record removed successfully!');
      }
    }

    loadSales();
  </script>
</body>
</html>
