<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Info - MeatMatrix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #b47e86 0%, #bf4f4f 50%, #f6f6f6 100%);
      min-height: 100vh;
      color: #333;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      padding: 2rem 2.5rem;
      margin-top: 3rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h2 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .info-list {
      background: rgba(139,38,53,0.05);
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      text-align: left;
      font-size: 1rem;
    }
    .info-list strong {
      color: #8B2635;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-user"></i> Customer Info</h2>
    <div class="info-list" style="padding:0;margin-top:1.5rem;text-align:left;">
      <div style="padding:1rem 0;border-bottom:1px solid #eee;"><strong>Name:</strong> Sumaiya Rahman</div>
      <div style="padding:1rem 0;border-bottom:1px solid #eee;"><strong>Email:</strong> rsumaiya1602@gmail.com</div>
      <div style="padding:1rem 0;"><strong>Phone:</strong> +880-987-654321</div>
    </div>
  </div>
</body>
</html>
