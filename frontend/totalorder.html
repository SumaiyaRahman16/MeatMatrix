<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Orders - MeatMatrix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #fef7f7 0%, #f8e8e8 100%); min-height: 100vh; padding: 20px; color: #2d1b1b; }
    .container { max-width: 700px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 8px 32px rgba(144,36,54,0.15); border: 1px solid rgba(255,255,255,0.2); overflow: hidden; }
    .header { background: linear-gradient(135deg, #8B2635, #6B6B6B); color: white; padding: 30px 20px; text-align: center; }
    .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 1rem; }
    .order-table { width: 100%; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(144,36,54,0.1); border: 1px solid rgba(144,36,54,0.1); margin: 30px 0; }
    .order-table th, .order-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(144,36,54,0.1); }
    .order-table th { background: linear-gradient(135deg, #8B2635, #6B6B6B); color: white; font-weight: 600; font-size: 0.9rem; }
    .order-table tr:last-child td { border-bottom: none; }
    .order-table tr:hover { background: rgba(144,36,54,0.03); }
    .back-btn { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #8B2635, #6B6B6B); color: white; text-decoration: none; margin-top: 20px; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(139, 38, 53, 0.2); }
    .back-btn:hover { background: linear-gradient(135deg, #6B1F2A, #5a5a5a); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139, 38, 53, 0.3); }
    @media (max-width: 700px) { .container { margin: 10px; border-radius: 16px; } .header { padding: 20px 10px; } .header h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Total Orders</h1>
      <p>All recent orders placed by customers</p>
    </div>

    <!-- TABLE 1: Orders from Database -->
    <h2 style="margin: 20px; color: #8B2635; font-size: 1.3rem;">📊 Orders from Database</h2>
    <table class="order-table" id="dbOrderTable">
      <thead>
        <tr>
          <th>Order No.</th>
          <th>Customer Name</th>
          <th>Total Kg</th>
          <th>Total Amount</th>
          <th>Phone Number</th>
        </tr>
      </thead>
      <tbody id="dbOrderTableBody">
        <!-- Database orders will be injected here -->
      </tbody>
    </table>

    <!-- TABLE 2: Pending Orders from localStorage (can mark as delivered) -->
    <h2 style="margin: 20px; color: #8B2635; font-size: 1.3rem;">📦 Pending Orders (Mark as Delivered)</h2>
    <table class="order-table" id="localOrderTable">
      <thead>
        <tr>
          <th>Order No.</th>
          <th>Item</th>
          <th>Quantity</th>
          <th>Total Price</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="localOrderTableBody">
        <!-- localStorage orders will be injected here -->
      </tbody>
    </table>

    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
  </div>
  <script>
    // ============ TABLE 1: DATABASE ORDERS ============
    // Fetch orders from backend database
    async function fetchDatabaseOrders() {
      try {
        const response = await fetch('http://localhost:3000/api/orders');
        const data = await response.json();
        
        if (data.success) {
          return data.orders;
        } else {
          console.error('Failed to fetch orders:', data.message);
          return [];
        }
      } catch (error) {
        console.error('Error fetching orders:', error);
        return [];
      }
    }

    async function renderDatabaseOrders() {
      const orders = await fetchDatabaseOrders();
      const dbOrderTableBody = document.getElementById('dbOrderTableBody');
      
      if (!orders.length) {
        dbOrderTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#999;">No database orders yet.</td></tr>';
        return;
      }
      
      dbOrderTableBody.innerHTML = orders.map((order) => `
        <tr>
          <td>ORD-${order.order_id}</td>
          <td>${order.name}</td>
          <td>${order.total_kg} kg</td>
          <td>৳${order.total_amount}</td>
          <td>${order.customer_number}</td>
        </tr>
      `).join('');
    }

    // ============ TABLE 2: LOCALSTORAGE ORDERS (WITH MARK AS DELIVERED) ============
    // Load orders from localStorage (exactly like before)
    function getLocalOrders() {
      return JSON.parse(localStorage.getItem('orders')) || [];
    }

    function saveLocalOrders(orders) {
      localStorage.setItem('orders', JSON.stringify(orders));
    }

    function renderLocalOrders() {
      const orders = getLocalOrders();
      const localOrderTableBody = document.getElementById('localOrderTableBody');
      
      if (!orders.length) {
        localOrderTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#999;">No pending orders.</td></tr>';
        return;
      }
      
      localOrderTableBody.innerHTML = orders.map((order, idx) => `
        <tr>
          <td>${order.orderNumber}</td>
          <td>${order.orderType}</td>
          <td>${order.orderKg} kg</td>
          <td>৳${order.totalPrice}</td>
          <td>${order.date}</td>
          <td>
            <button onclick="markAsDelivered(${idx})" style="background:#22c55e;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Mark as Delivered</button>
          </td>
        </tr>
      `).join('');
    }

    function markAsDelivered(idx) {
      let orders = getLocalOrders();
      const deliveredOrder = orders[idx];
      
      // Add to salesData in localStorage (exactly like before)
      let salesData = JSON.parse(localStorage.getItem('salesData')) || [];
      salesData.push({
        date: new Date().toISOString().split('T')[0],
        item: deliveredOrder.orderType,
        kg: deliveredOrder.orderKg,
        total: deliveredOrder.totalPrice
      });
      localStorage.setItem('salesData', JSON.stringify(salesData));
      
      // Remove from orders
      orders.splice(idx, 1);
      saveLocalOrders(orders);
      
      // Re-render
      renderLocalOrders();
      
      alert('Order marked as delivered and moved to Total Sales!');
    }

    // Accept new order from checkout page (exactly like before)
    function acceptOrderFromCart() {
      const cartOrder = localStorage.getItem('cartOrder');
      if (cartOrder) {
        const cartData = JSON.parse(cartOrder);
        const orders = getLocalOrders();
        const today = new Date().toISOString().split('T')[0];
        
        cartData.forEach((item, idx) => {
          orders.push({
            orderNumber: `ORD-${orders.length+1}`,
            orderType: item.name,
            orderKg: item.quantity,
            price: item.price,
            totalPrice: item.price * item.quantity,
            date: today
          });
        });
        
        saveLocalOrders(orders);
        localStorage.removeItem('cartOrder');
      }
    }

    // On page load, render BOTH tables
    acceptOrderFromCart(); // Accept any new cart orders first
    renderDatabaseOrders(); // Render database orders
    renderLocalOrders(); // Render localStorage orders
  </script>
</body>
</html>
