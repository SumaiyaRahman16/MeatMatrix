<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Orders - MeatMatrix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #fef7f7 0%, #f8e8e8 100%); min-height: 100vh; padding: 20px; color: #2d1b1b; }
    .container { max-width: 700px; margin: 0 auto; background: rgba(255,255,255,0.95); border-radius: 20px; box-shadow: 0 8px 32px rgba(144,36,54,0.15); border: 1px solid rgba(255,255,255,0.2); overflow: hidden; }
    .header { background: linear-gradient(135deg, #902436, #994d64); color: white; padding: 30px 20px; text-align: center; }
    .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 1rem; }
    .order-table { width: 100%; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(144,36,54,0.1); border: 1px solid rgba(144,36,54,0.1); margin: 30px 0; }
    .order-table th, .order-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(144,36,54,0.1); }
    .order-table th { background: linear-gradient(135deg, #902436, #994d64); color: white; font-weight: 600; font-size: 0.9rem; }
    .order-table tr:last-child td { border-bottom: none; }
    .order-table tr:hover { background: rgba(144,36,54,0.03); }
    .back-btn { display: inline-flex; align-items: center; gap: 10px; color: #902436; text-decoration: none; margin-top: 20px; padding: 10px 18px; border-radius: 10px; font-weight: 600; background: rgba(144,36,54,0.05); }
    .back-btn:hover { background: rgba(144,36,54,0.1); transform: translateX(-5px); }
    @media (max-width: 700px) { .container { margin: 10px; border-radius: 16px; } .header { padding: 20px 10px; } .header h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Total Orders</h1>
      <p>All recent orders placed by customers</p>
    </div>
    <table class="order-table" id="orderTable">
      <thead>
        <tr>
          <th>Order No.</th>
          <th>Item</th>
          <th>Quantity</th>
          <th>Total Price</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="orderTableBody">
        <!-- Orders will be injected here -->
      </tbody>
    </table>
    <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
  </div>
  <script>
    // Load orders from localStorage
    function getOrders() {
      return JSON.parse(localStorage.getItem('orders')) || [];
    }
    function saveOrders(orders) {
      localStorage.setItem('orders', JSON.stringify(orders));
    }
    function renderOrders() {
      const orders = getOrders();
      const orderTableBody = document.getElementById('orderTableBody');
      if (!orders.length) {
        orderTableBody.innerHTML = '<tr><td colspan="6">No orders yet.</td></tr>';
        return;
      }
      orderTableBody.innerHTML = orders.map((order, idx) => `
        <tr>
          <td>${order.orderNumber}</td>
          <td>${order.orderType}</td>
          <td>${order.orderKg}</td>
          <td>৳${order.totalPrice}</td>
          <td>${order.date}</td>
          <td>
            <button onclick="markAsDelivered(${idx})" style="background:#22c55e;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Mark as Delivered</button>
          </td>
        </tr>
      `).join('');
    }
    function markAsDelivered(idx) {
      let orders = getOrders();
      const deliveredOrder = orders[idx];
      let salesData = JSON.parse(localStorage.getItem('salesData')) || [];
      salesData.push({
        date: new Date().toISOString().split('T')[0],
        item: deliveredOrder.orderType,
        kg: deliveredOrder.orderKg,
        total: deliveredOrder.totalPrice
      });
      localStorage.setItem('salesData', JSON.stringify(salesData));
      orders.splice(idx, 1);
      saveOrders(orders);
      renderOrders();
      alert('Order marked as delivered and moved to Total Sales!');
    }
    // Accept new order from customerpage.html
    function acceptOrderFromCart() {
      const cartOrder = localStorage.getItem('cartOrder');
      if (cartOrder) {
        const cartData = JSON.parse(cartOrder);
        const orders = getOrders();
        const today = new Date().toISOString().split('T')[0];
        cartData.forEach((item, idx) => {
          orders.push({
            orderNumber: `ORD-${orders.length+1}`,
            orderType: item.name,
            orderKg: item.quantity,
            price: item.price,
            totalPrice: item.price * item.quantity,
            date: today
          });
        });
        saveOrders(orders);
        localStorage.removeItem('cartOrder');
      }
    }
    // On page load, accept new order and render
    acceptOrderFromCart();
    renderOrders();
  </script>
</body>
</html>
