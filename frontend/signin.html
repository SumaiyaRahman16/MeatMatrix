<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeatMatrix - Login</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;

      background: linear-gradient(135deg, #8B2635 0%, #6B6B6B 50%, #4A4A4A 100%);
      

      
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .login-container:hover {
      transform: translateY(-5px);
    }

    h2 {
      margin-bottom: 30px;
      font-size: 2rem;
      font-weight: 700;

      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      

      
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 15px 18px;
      margin: 12px 0;
      border: 2px solid #e1e5e9;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;

      border-color: #8B2635;
      box-shadow: 0 0 0 3px rgba(139, 38, 53, 0.1);

      
      transform: translateY(-2px);
    }

    input[type="text"]:hover,
    input[type="email"]:hover,
    input[type="password"]:hover {

      border-color: #8B2635;
      

    }

    button {
      width: 100%;
      padding: 15px;
    
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      

      
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;

      box-shadow: 0 8px 25px rgba(139, 38, 53, 0.25);
      

    }

    button:hover {
      transform: translateY(-3px);

      box-shadow: 0 15px 35px rgba(139, 38, 53, 0.35);
      

    }

    button:active {
      transform: translateY(-1px);
    }

    .link {
      margin-top: 20px;
      display: block;
      font-size: 14px;
      font-weight: 500;
   
      color: #8B2635;
      
  
      
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .link:hover {
 
      color: #6B6B6B;
    
      
      text-decoration: underline;
    }


    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
        margin: 10px;
      }
      
      h2 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Log in</h2>
    
    <form id="signinForm">
      <input type="email" id="email" placeholder="Email" required >
      <input type="password" id="password" placeholder="Password" required>
      <div id="signinMessage" style="margin-top: 10px; color: #b00020; font-size: 14px;" aria-live="polite"></div>
      <button type="submit" id="loginBtn">Login</button>
    </form>

    <a href="signup.html" class="link">Don't have an account? Sign up</a>
  </div>

  <script>
    // Signin form submission - sends JSON to backend /api/auth/login
    (function(){
      const form = document.getElementById('signinForm');
      const msg = document.getElementById('signinMessage');
      const loginBtn = document.getElementById('loginBtn');

      function showMessage(text, isError = true) {
        msg.textContent = text || '';
        msg.style.color = isError ? '#b00020' : '#006400';
      }

      form.addEventListener('submit', async function(e){
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showMessage('Please enter both email and password.');
          return;
        }

        const payload = { email, password };
        const url = 'http://localhost:3000/api/auth/login';

        try {
          loginBtn.disabled = true;
          showMessage('Logging in... please wait', false);

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json().catch(() => ({}));

          if (res.status === 200) {
            showMessage('Login successful! Redirecting...', false);

            // Redirect based on user role
            const redirectUrl = data.role === 'manager' ? 'dashboard.html' : 'customerpage.html';

            // Store user info in sessionStorage for future reference
            sessionStorage.setItem('userRole', data.role);
            sessionStorage.setItem('userEmail', email);

            // Also save basic user object to localStorage so profile sidebar can read name/email
            try {
              const nameFromResponse = data.name || data.username || null;
              const derivedName = nameFromResponse || email.split('@')[0];
              const userObj = { name: derivedName, email };
              localStorage.setItem('user', JSON.stringify(userObj));
            } catch (e) {
              console.warn('Could not save user to localStorage', e);
            }

            // Small delay so user sees message
            setTimeout(() => { window.location.href = redirectUrl; }, 700);
          } else if (res.status === 401) {
            showMessage(data.message || 'Invalid email or password.');
          } else if (res.status === 400) {
            showMessage(data.message || 'Please enter valid email and password.');
          } else {
            showMessage(data.message || 'Login failed. Please try again.');
          }

        } catch (err) {
          console.error('Login error', err);
          showMessage('Network error. Please check if the server is running.');
        } finally {
          loginBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
