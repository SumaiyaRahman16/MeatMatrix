<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeatMatrix - Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* Option 1: Professional Reddish + Gray */
      background: linear-gradient(135deg, #8B2635 0%, #6B6B6B 50%, #4A4A4A 100%);
      
      /* Option 2: Professional Blue (uncomment to use)
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #64748b 100%); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      background: linear-gradient(135deg, #374151 0%, #6b7280 50%, #9ca3af 100%); */
      
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #333;
      line-height: 1.6;
    }

    .admin-login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 450px;
      transition: transform 0.3s ease;
    }

    .admin-login-container:hover {
      transform: translateY(-5px);
    }

    .form-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      /* Option 1: Professional Reddish + Gray */
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      
      /* Option 2: Professional Blue (uncomment to use)
      background: linear-gradient(135deg, #1e3a8a, #3b82f6); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      background: linear-gradient(135deg, #374151, #6b7280); */
      
      color: white;
      border-radius: 25px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(139, 38, 53, 0.2);
    }

    .form-header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      /* Option 1: Professional Reddish + Gray */
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      
      /* Option 2: Professional Blue (uncomment to use)
      background: linear-gradient(135deg, #1e3a8a, #3b82f6); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      background: linear-gradient(135deg, #374151, #6b7280); */
      
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .subtitle {
      color: #666;
      font-size: 1rem;
      margin-bottom: 0;
    }

    .form-group {
      margin-bottom: 1.8rem;
    }

    label {
      display: block;
      margin-bottom: 0.8rem;
      color: #444;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 1rem 1.2rem;
      border: 2px solid #e1e5e9;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      /* Option 1: Professional Reddish + Gray */
      border-color: #8B2635;
      box-shadow: 0 0 0 3px rgba(139, 38, 53, 0.1);
      
      /* Option 2: Professional Blue (uncomment to use)
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      border-color: #374151;
      box-shadow: 0 0 0 3px rgba(55, 65, 81, 0.1); */
      
      transform: translateY(-2px);
    }

    input[type="email"]:hover,
    input[type="password"]:hover {
      /* Option 1: Professional Reddish + Gray */
      border-color: #8B2635;
      
      /* Option 2: Professional Blue (uncomment to use)
      border-color: #1e3a8a; */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      border-color: #374151; */
    }

    .login-btn {
      width: 100%;
      /* Option 1: Professional Reddish + Gray */
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      
      /* Option 2: Professional Blue (uncomment to use)
      background: linear-gradient(135deg, #1e3a8a, #3b82f6); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      background: linear-gradient(135deg, #374151, #6b7280); */
      
      color: white;
      border: none;
      padding: 1.2rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
      /* Option 1: Professional Reddish + Gray */
      box-shadow: 0 8px 25px rgba(139, 38, 53, 0.25);
      
      /* Option 2: Professional Blue (uncomment to use)
      box-shadow: 0 8px 25px rgba(30, 58, 138, 0.25); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      box-shadow: 0 8px 25px rgba(55, 65, 81, 0.25); */
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      /* Option 1: Professional Reddish + Gray */
      box-shadow: 0 15px 35px rgba(139, 38, 53, 0.35);
      
      /* Option 2: Professional Blue (uncomment to use)
      box-shadow: 0 15px 35px rgba(30, 58, 138, 0.35); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      box-shadow: 0 15px 35px rgba(55, 65, 81, 0.35); */
    }

    .login-btn:active {
      transform: translateY(-1px);
    }

    .security-notice {
      background: rgba(255, 243, 205, 0.9);
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #92400e;
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-link a {
      /* Option 1: Professional Reddish + Gray */
      color: #8B2635;
      
      /* Option 2: Professional Blue (uncomment to use)
      color: #1e3a8a; */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      color: #374151; */
      
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .back-link a:hover {
      /* Option 1: Professional Reddish + Gray */
      color: #6B6B6B;
      
      /* Option 2: Professional Blue (uncomment to use)
      color: #3b82f6; */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      color: #6b7280; */
      
      text-decoration: underline;
    }

    .admin-features {
      background: rgba(240, 253, 244, 0.9);
      border: 1px solid #10b981;
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #065f46;
    }

    .admin-features h4 {
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .admin-features ul {
      list-style: none;
      padding-left: 0;
    }

    .admin-features li {
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .create-btn {
      width: 100%;
      /* Option 1: Professional Reddish + Gray */
      background: linear-gradient(135deg, #8B2635, #6B6B6B);
      
      /* Option 2: Professional Blue (uncomment to use)
      background: linear-gradient(135deg, #1e3a8a, #3b82f6); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      background: linear-gradient(135deg, #374151, #6b7280); */
      
      color: white;
      border: none;
      padding: 1.2rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
      /* Option 1: Professional Reddish + Gray */
      box-shadow: 0 8px 25px rgba(139, 38, 53, 0.25);
      
      /* Option 2: Professional Blue (uncomment to use)
      box-shadow: 0 8px 25px rgba(30, 58, 138, 0.25); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      box-shadow: 0 8px 25px rgba(55, 65, 81, 0.25); */
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .create-btn:hover {
      transform: translateY(-3px);
      /* Option 1: Professional Reddish + Gray */
      box-shadow: 0 15px 35px rgba(139, 38, 53, 0.35);
      
      /* Option 2: Professional Blue (uncomment to use)
      box-shadow: 0 15px 35px rgba(30, 58, 138, 0.35); */
      
      /* Option 3: Neutral Gray/Charcoal (uncomment to use)
      box-shadow: 0 15px 35px rgba(55, 65, 81, 0.35); */
    }

    .create-btn:active {
      transform: translateY(-1px);
    }


    /* Responsive */
    @media (max-width: 480px) {
      .admin-login-container {
        padding: 2rem;
        margin: 10px;
      }
      
      .form-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="admin-login-container">
    <div class="form-header">
      <div class="admin-badge">
        <i class="fas fa-shield-alt"></i>
        Admin Access
      </div>
      <h1>Admin Panel</h1>
      <p class="subtitle">Secure administrator login portal</p>
    </div>

    <div class="security-notice">
      <i class="fas fa-exclamation-triangle"></i>
      <span>Restricted access. Only authorized personnel allowed.</span>
    </div>

    <form action="dashboard.html" method="POST">
      <div class="form-group">
        <label for="adminEmail">
          <i class="fas fa-envelope"></i>
          Administrator Email
        </label>
        <input type="email" id="adminEmail" name="adminEmail" placeholder="Enter your admin email" required>
      </div>
      
      <div class="form-group">
        <label for="adminPassword">
          <i class="fas fa-lock"></i>
          Password
        </label>
        <input type="password" id="adminPassword" name="adminPassword" placeholder="Enter your secure password" required>
      </div>

      <button type="button" class="create-btn" onclick="window.location.href='dashboard.html'">Log in</button>
    </form>



  </div>
</body>
</html>
