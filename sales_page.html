<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeatMatrix - Sales</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #902436 0%, #994d64 100%);
      color: #fff;
    }

    header {
      background: rgba(0, 0, 0, 0.6);
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .card {
      background: #fff;
      color: #333;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
      text-align: center;
      transition: transform 0.2s ease-in-out;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #902436;
    }

    .card p {
      margin: 8px 0;
    }

    .order-btn {
      margin-top: 15px;
      padding: 10px 15px;
      background: #902436;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .order-btn:hover {
      background: #73202c;
    }
  </style>
</head>
<body>
  <header>Available Items for Sale</header>

  <div class="container">
    <!-- Meat -->
    <div class="card">
      <h3>Meat</h3>
      <p><strong>Price:</strong> 500 BDT/kg</p>
      <p><strong>Stock:</strong> 20 kg</p>
      <button class="order-btn" onclick="orderNow('Meat')">Order Now</button>
    </div>

    <!-- Duck -->
    <div class="card">
      <h3>Duck</h3>
      <p><strong>Price:</strong> 400 BDT/kg</p>
      <p><strong>Stock:</strong> 15 kg</p>
      <button class="order-btn" onclick="orderNow('Duck')">Order Now</button>
    </div>

    <!-- Chicken -->
    <div class="card">
      <h3>Chicken</h3>
      <p><strong>Price:</strong> 300 BDT/kg</p>
      <p><strong>Stock:</strong> 25 kg</p>
      <button class="order-btn" onclick="orderNow('Chicken')">Order Now</button>
    </div>

    <!-- Mutton -->
    <div class="card">
      <h3>Mutton</h3>
      <p><strong>Price:</strong> 800 BDT/kg</p>
      <p><strong>Stock:</strong> 10 kg</p>
      <button class="order-btn" onclick="orderNow('Mutton')">Order Now</button>
    </div>
  </div>

  <script>
    function orderNow(itemName) {
      // redirect to order page with selected item as query parameter
      window.location.href = "order.html?item=" + encodeURIComponent(itemName);
    }
  </script>
</body>
</html>
