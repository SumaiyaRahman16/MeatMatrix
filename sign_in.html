<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meat Matrix</title>
  <style>
    /* Body and background */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #902436 0%, #994d64 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Login container */
    .login-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      width: 360px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 28px;
      color: #a83232;
      letter-spacing: 1px;
    }


    /* Input fields */
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: border 0.3s ease, box-shadow 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #a83232;
      box-shadow: 0 0 8px rgba(168, 50, 50, 0.3);
      outline: none;
    }

    /* Login button */
    button {
      width: 100%;
      padding: 14px;
      background: #a83232;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      background: #7a2424;
    }

    /* Signup link */
    .link {
      margin-top: 18px;
      display: block;
      font-size: 14px;
      color: #a83232;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .link:hover {
      color: #7a2424;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2>Meat Matrix</h2>
    <form action="dashboard.html">
      <input type="text" id="userIdEmail" placeholder="Email or User ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <a href="login.html" class="link">Don’t have an account? Sign up</a>
  </div>
</body>

</html>
